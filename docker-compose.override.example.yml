# Необязательные машинные дополнения к docker-compose.yml.
#
# Всё основное (секреты, порты, рабочая папка, логины gh/glab) уже приходит
# из .env в сам docker-compose.yml, поэтому этот файл нужен только для того,
# что у каждой машины своё: SSH-ключи/ssh-agent, дополнительные проекты,
# extra_hosts. Docker Compose подхватывает docker-compose.override.yml
# автоматически, если он лежит рядом с docker-compose.yml.
#
#   cp docker-compose.override.example.yml docker-compose.override.yml
#
# Ниже рабочие примеры — раскомментируйте нужные строки.

services:
  deepseek-harness:
    # ssh-agent хоста — только если ключ под паролем и сокет проброшен ниже.
    # environment:
    #   - SSH_AUTH_SOCK=/ssh-agent
    #
    # volumes:
    #   - ${SSH_DIR}:/root/.ssh:ro # ключи для git по SSH (SSH_DIR в .env)
    #   - ${SSH_AUTH_SOCK_PATH}:/ssh-agent # сокет ssh-agent (SSH_AUTH_SOCK_PATH в .env)
    #   - ${PROJECT_HLRD_DIR}:/root/hlrd2021 # доп. проект агента (путь в .env)
    #   - ${PROJECT_DATING_DIR}:/root/dating-app # доп. проект агента (путь в .env)
    extra_hosts:
      - "parent:host-gateway" # пример: доступ к хосту по имени parent
